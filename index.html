<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15101d">
<title>Волна</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#15101d;--panel:#211a2e;--text:#f4eee8;--dim:#9d93ad;--acc:#ff6b8a;--acc2:#ffb36b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;overflow:hidden}
#bgart{position:fixed;inset:-40px;background-size:cover;background-position:center;filter:blur(60px) saturate(1.3);opacity:.35;transition:background-image .6s}
#app{position:relative;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.view{flex:1;overflow-y:auto;padding:18px 18px 170px;display:none}
.view.on{display:block}
h1{font-size:28px;font-weight:800;margin-bottom:14px}
.wave{display:flex;flex-direction:column;align-items:center;padding-top:6vh}
.orb{width:min(62vw,260px);aspect-ratio:1;border-radius:50%;border:0;color:#2a1020;font:800 22px Manrope;background:conic-gradient(from 0deg,var(--acc),var(--acc2),#c06bff,var(--acc));box-shadow:0 0 70px rgba(255,107,138,.45);animation:spin 14s linear infinite;position:relative}
.orb span{position:absolute;inset:14%;border-radius:50%;background:var(--bg);color:var(--text);display:grid;place-items:center;animation:spin 14s linear infinite reverse}
.orb.live{animation-duration:5s}.orb.live span{animation-duration:5s}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.orb,.orb span{animation:none}}
.hint{color:var(--dim);font-size:14px;text-align:center;margin-top:28px;max-width:290px;line-height:1.5}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.tags b{font-weight:600;font-size:13px;background:var(--panel);padding:6px 12px;border-radius:99px}
input{width:100%;background:var(--panel);border:0;color:var(--text);font:600 16px Manrope;padding:14px 16px;border-radius:14px;outline:none;margin-bottom:10px}
input:focus-visible{outline:2px solid var(--acc)}
.row{display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer}
.row img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--panel)}
.row div{flex:1;min-width:0}
.row p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t{font-weight:600}.row .a{color:var(--dim);font-size:13px;margin-top:2px}
.row.cur .t{color:var(--acc)}
.ib{background:none;border:0;color:var(--text);cursor:pointer;display:grid;place-items:center;padding:8px}
.ib svg{width:26px;height:26px;fill:currentColor}
.ib.liked{color:var(--acc)}
.empty{color:var(--dim);text-align:center;margin-top:12vh;line-height:1.6}
iframe{width:100%;border:0;border-radius:14px;margin-top:8px}
/* mini */
#mini{position:fixed;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom));background:rgba(33,26,46,.92);backdrop-filter:blur(16px);border-radius:18px;display:none;align-items:center;gap:10px;padding:8px 8px 10px;overflow:hidden}
#mini.on{display:flex}
#mini img{width:46px;height:46px;border-radius:10px;object-fit:cover}
#mini .info{flex:1;min-width:0}
#mini .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);width:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(21,16,29,.95);padding-bottom:env(safe-area-inset-bottom);height:calc(60px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--dim);font:600 12px Manrope;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button.on{color:var(--acc)}
nav svg{width:24px;height:24px;fill:currentColor}
/* full */
#full{position:fixed;inset:0;background:var(--bg);transform:translateY(100%);transition:transform .3s;display:flex;flex-direction:column;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 26px calc(26px + env(safe-area-inset-bottom))}
#full.on{transform:none}
#full .art{width:min(84vw,46vh);aspect-ratio:1;border-radius:22px;object-fit:cover;margin-top:3vh;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#full h2{font-size:22px;font-weight:800;margin-top:3vh;text-align:center;max-width:100%}
#full .a{color:var(--dim);margin-top:4px}
#seek{margin:3vh 0 0;width:100%;accent-color:var(--acc);background:none;padding:0}
.tm{display:flex;justify-content:space-between;width:100%;color:var(--dim);font-size:12px}
.ctl{display:flex;align-items:center;gap:14px;margin-top:2vh}
.ctl .ib svg{width:34px;height:34px}
.play{background:var(--text);color:var(--bg);border-radius:50%;width:74px;height:74px}
.play svg{width:34px;height:34px}
.down{align-self:flex-start;margin-left:-8px}
.wavetag{color:var(--acc);font-size:13px;font-weight:600;margin-top:8px;min-height:18px}
</style>
</head>
<body>
<div id="bgart"></div>
<div id="app">
 <section class="view on" id="v-wave">
  <div class="wave">
   <button class="orb" id="orb"><span id="orbtxt">Моя волна</span></button>
   <p class="hint" id="hint">Нажми, и пойдёт музыка. Лайк учит волну твоим вкусам, пропуск — что не надо.</p>
   <div class="tags" id="tags"></div>
  </div>
 </section>
 <section class="view" id="v-search">
  <h1>Поиск</h1>
  <input id="q" type="search" placeholder="Трек или исполнитель" enterkeyhint="search">
  <div id="res"></div>
  <h1 style="margin-top:28px;font-size:20px">Ссылка SoundCloud</h1>
  <input id="sc" type="url" placeholder="Вставь ссылку на трек или плейлист">
  <div id="scbox"></div>
 </section>
 <section class="view" id="v-fav">
  <h1>Избранное</h1>
  <div id="favs"></div>
 </section>
</div>

<div id="mini">
 <img id="mimg" alt=""><div class="info"><p class="t" id="mt" style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></p><p class="a" id="ma" style="color:var(--dim);font-size:13px"></p></div>
 <button class="ib" id="mplay" aria-label="Пауза"></button>
 <button class="ib" id="mnext" aria-label="Дальше"></button>
 <div class="bar" id="mbar"></div>
</div>

<nav>
 <button class="on" data-v="wave"><svg viewBox="0 0 24 24"><path d="M3 12h2v0M5 9h2v6H5zM9 5h2v14H9zM13 8h2v8h-2zM17 3h2v18h-2zM21 10h-1v4h1z"/></svg>Волна</button>
 <button data-v="search"><svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 105.2 11.7l4.5 4.5 1.4-1.4-4.5-4.5A7 7 0 0010 3zm0 2a5 5 0 110 10 5 5 0 010-10z"/></svg>Поиск</button>
 <button data-v="fav"><svg viewBox="0 0 24 24"><path d="M12 21l-1.4-1.3C5.4 15 2 12 2 8.5 2 5.5 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.800 3 16.500 3 19.600 3 22 5.500 22 8.500c0 3.500-3.400 6.500-8.600 11.200z"/></svg>Избранное</button>
</nav>

<div id="full">
 <button class="ib down" id="close" aria-label="Свернуть"><svg viewBox="0 0 24 24"><path d="M7.400 8.600L12 13.200l4.600-4.600L18 10l-6 6-6-6z"/></svg></button>
 <img class="art" id="fimg" alt="">
 <h2 id="ft"></h2><p class="a" id="fa"></p>
 <p class="wavetag" id="fw"></p>
 <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка">
 <div class="tm"><span id="cur">0:00</span><span id="dur">0:00</span></div>
 <div class="ctl">
  <button class="ib" id="like" aria-label="Нравится"></button>
  <button class="ib" id="prev" aria-label="Назад"></button>
  <button class="ib play" id="play" aria-label="Играть"></button>
  <button class="ib" id="next" aria-label="Дальше"></button>
  <button class="ib" id="mode" aria-label="Режим"></button>
 </div>
</div>
<audio id="au" preload="auto"></audio>

<script>
const API='https://api.audius.co/v1', APP='my-wave-player';
const $=s=>document.querySelector(s), au=$('#au');
const I={
 play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
 pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
 next:'<svg viewBox="0 0 24 24"><path d="M6 6l9 6-9 6zM16 6h2v12h-2z"/></svg>',
 prev:'<svg viewBox="0 0 24 24"><path d="M18 6l-9 6 9 6zM6 6h2v12H6z"/></svg>',
 heart:'<svg viewBox="0 0 24 24"><path d="M12 21l-1.400-1.300C5.400 15 2 12 2 8.500 2 5.500 4.400 3 7.500 3c1.700 0 3.400.8 4.500 2.100C13.100 3.800 14.800 3 16.500 3 19.600 3 22 5.500 22 8.500c0 3.500-3.400 6.500-8.600 11.200z"/></svg>',
 wave:'<svg viewBox="0 0 24 24"><path d="M5 9h2v6H5zM9 5h2v14H9zM13 8h2v8h-2zM17 3h2v18h-2z"/></svg>',
 list:'<svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>'
};
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let favs=ld('favs',[]), taste=ld('taste',{g:{},m:{}}), seen=ld('seen',[]);
let queue=[], idx=-1, waveOn=false, cur=null;

const fmt=s=>isNaN(s)?'0:00':Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const art=t=>t.artwork&&(t.artwork['480x480']||t.artwork['150x150'])||'';
const isFav=t=>favs.some(f=>f.id===t.id);

async function api(path){
 const r=await fetch(API+path+(path.includes('?')?'&':'?')+'app_name='+APP);
 if(!r.ok) throw new Error(r.status); return (await r.json()).data||[];
}

/* ---------- навигация ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button,.view').forEach(e=>e.classList.remove('on'));
 b.classList.add('on'); $('#v-'+b.dataset.v).classList.add('on');
 if(b.dataset.v==='fav') renderFavs();
});

/* ---------- список треков ---------- */
function rows(list,box,onTap){
 box.innerHTML='';
 list.forEach((t,i)=>{
  const r=document.createElement('div'); r.className='row'+(cur&&cur.id===t.id?' cur':'');
  r.innerHTML=`<img src="${art(t)}" alt="" loading="lazy"><div><p class="t"></p><p class="a"></p></div>`;
  r.querySelector('.t').textContent=t.title; r.querySelector('.a').textContent=t.user.name;
  r.onclick=()=>onTap(i); box.appendChild(r);
 });
}
function playList(list,i,wave=false){ waveOn=wave; queue=list.slice(); idx=i; load(); }

/* ---------- плеер ---------- */
function load(){
 cur=queue[idx]; if(!cur) return;
 au.src=`${API}/tracks/${cur.id}/stream?app_name=${APP}`;
 au.play().catch(()=>{});
 seen=[cur.id,...seen.filter(x=>x!==cur.id)].slice(0,300); sv('seen',seen);
 $('#mini').classList.add('on');
 $('#mimg').src=$('#fimg').src=art(cur);
 $('#bgart').style.backgroundImage=`url(${art(cur)})`;
 $('#mt').textContent=$('#ft').textContent=cur.title;
 $('#ma').textContent=$('#fa').textContent=cur.user.name;
 $('#fw').textContent=waveOn?'Моя волна':'';
 $('#orb').classList.toggle('live',waveOn);
 $('#orbtxt').textContent=waveOn?cur.title.slice(0,24):'Моя волна';
 setLike(); mediaSession();
 if(waveOn && queue.length-idx<4) refill();
}
function setLike(){ $('#like').classList.toggle('liked',isFav(cur)); }
function next(skip){
 if(skip&&waveOn) learn(cur,-1);
 if(idx<queue.length-1){idx++;load()} else if(waveOn){refill().then(()=>{idx++;load()})}
}
function prev(){ if(au.currentTime>4||idx===0){au.currentTime=0}else{idx--;load()} }
function toggle(){ au.paused?au.play():au.pause(); }
function mediaSession(){
 if(!('mediaSession' in navigator)) return;
 navigator.mediaSession.metadata=new MediaMetadata({title:cur.title,artist:cur.user.name,artwork:[{src:art(cur),sizes:'480x480'}]});
 navigator.mediaSession.setActionHandler('play',toggle);
 navigator.mediaSession.setActionHandler('pause',toggle);
 navigator.mediaSession.setActionHandler('nexttrack',()=>next(true));
 navigator.mediaSession.setActionHandler('previoustrack',prev);
}
au.onplay=au.onpause=()=>{ const h=au.paused?I.play:I.pause; $('#play').innerHTML=h; $('#mplay').innerHTML=h; };
au.ontimeupdate=()=>{
 const p=au.duration?au.currentTime/au.duration:0;
 $('#mbar').style.width=p*100+'%'; $('#seek').value=p*1000;
 $('#cur').textContent=fmt(au.currentTime); $('#dur').textContent=fmt(au.duration);
};
au.onended=()=>{ if(waveOn) learn(cur,1); next(false); };
au.onerror=()=>setTimeout(()=>next(false),400);
$('#seek').oninput=e=>{ if(au.duration) au.currentTime=au.duration*e.target.value/1000; };
$('#play').onclick=$('#mplay').onclick=e=>{e.stopPropagation();toggle()};
$('#next').onclick=$('#mnext').onclick=e=>{e.stopPropagation();next(true)};
$('#prev').onclick=prev;
$('#mini').onclick=()=>$('#full').classList.add('on');
$('#close').onclick=()=>$('#full').classList.remove('on');
$('#like').onclick=()=>{
 if(isFav(cur)) favs=favs.filter(f=>f.id!==cur.id); else {favs.unshift(cur); learn(cur,3);}
 sv('favs',favs); setLike();
};
$('#mode').onclick=()=>{ if(!waveOn){waveOn=true; $('#fw').textContent='Моя волна'; refill();} else {waveOn=false; $('#fw').textContent='';} };
$('#mode').innerHTML=I.wave; $('#like').innerHTML=I.heart; $('#prev').innerHTML=I.prev;
$('#next').innerHTML=$('#mnext').innerHTML=I.next; $('#play').innerHTML=$('#mplay').innerHTML=I.play;

/* ---------- Моя волна ---------- */
function learn(t,w){
 if(t.genre) taste.g[t.genre]=(taste.g[t.genre]||0)+w;
 if(t.mood) taste.m[t.mood]=(taste.m[t.mood]||0)+w;
 sv('taste',taste); renderTags();
}
function pick(obj){
 const e=Object.entries(obj).filter(([,v])=>v>0);
 if(!e.length) return null;
 let r=Math.random()*e.reduce((s,[,v])=>s+v,0);
 for(const [k,v] of e){ if((r-=v)<=0) return k; }
 return e[0][0];
}
async function refill(){
 let got=[];
 for(let n=0;n<3&&got.length<8;n++){
  const g=pick(taste.g), explore=Math.random()<.25;
  try{
   const list=await api('/tracks/trending?time='+(Math.random()<.5?'week':'month')+'&limit=40'+(g&&!explore?'&genre='+encodeURIComponent(g):''));
   const bad=new Set(Object.entries(taste.g).filter(([,v])=>v<-3).map(([k])=>k));
   got=got.concat(list.filter(t=>!seen.includes(t.id)&&!queue.some(q=>q.id===t.id)&&!bad.has(t.genre)&&t.duration>60));
  }catch(e){}
 }
 got.sort(()=>Math.random()-.5);
 queue=queue.concat(got.slice(0,10));
 return got.length;
}
function renderTags(){
 const top=Object.entries(taste.g).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,5);
 $('#tags').innerHTML=top.map(([k])=>`<b>${k}</b>`).join('');
}
$('#orb').onclick=async()=>{
 if(waveOn&&cur){ $('#full').classList.add('on'); return; }
 $('#orbtxt').textContent='Ищу…'; waveOn=true; queue=[]; idx=-1;
 const n=await refill();
 if(!n){ $('#orbtxt').textContent='Нет сети'; waveOn=false; $('#hint').textContent='Не получилось загрузить музыку. Проверь интернет и нажми ещё раз.'; return; }
 idx=0; load();
};
renderTags();

/* ---------- поиск ---------- */
let tm;
$('#q').oninput=e=>{
 clearTimeout(tm); const v=e.target.value.trim();
 if(!v){$('#res').innerHTML='';return}
 tm=setTimeout(async()=>{
  try{ const l=await api('/tracks/search?query='+encodeURIComponent(v)+'&limit=30');
   if(!l.length){$('#res').innerHTML='<p class="empty">Ничего не нашлось. Попробуй другое название.</p>';return}
   rows(l,$('#res'),i=>playList(l,i));
  }catch(x){$('#res').innerHTML='<p class="empty">Поиск не отвечает. Проверь интернет.</p>'}
 },350);
};
$('#sc').onchange=e=>{
 const u=e.target.value.trim();
 $('#scbox').innerHTML=u?`<iframe height="300" allow="autoplay" src="https://w.soundcloud.com/player/?url=${encodeURIComponent(u)}&color=%23ff6b8a&auto_play=true&visual=false"></iframe>`:'';
 if(u) au.pause();
};

/* ---------- избранное ---------- */
function renderFavs(){
 if(!favs.length){$('#favs').innerHTML='<p class="empty">Пока пусто.<br>Нажми сердце в плеере, и трек появится здесь.</p>';return}
 rows(favs,$('#favs'),i=>playList(favs,i));
}
</script>
</body>
</html>
